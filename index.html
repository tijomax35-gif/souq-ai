<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SOUQ AI — متجرك الذكي من السودان</title>

  <meta
    name="description"
    content="SOUQ AI يساعد التجار على إنشاء متجر إلكتروني احترافي وإنتاج محتوى المنتجات بالذكاء الاصطناعي."
  >

  <style>
    :root {
      --green: #087a58;
      --dark: #073b36;
      --gold: #c89b4b;
      --cream: #fbfaf6;
      --text: #173b39;
      --muted: #63736f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffffee;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e7eee9;
    }

    nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      color: var(--dark);
    }

    .logo span {
      color: var(--green);
    }

    .links {
      display: flex;
      gap: 25px;
      font-size: 14px;
    }

    .links a:hover {
      color: var(--green);
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 19px;
      border-radius: 12px;
      font-weight: 800;
      border: 1px solid #dbe7e1;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .secondary {
      background: #fff;
      color: var(--dark);
    }

    .hero {
      padding: 70px 0 45px;
      background: linear-gradient(135deg, #f7fbf8, #fff8ed);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: #e4f4ec;
      color: var(--green);
      padding: 7px 13px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      font-size: clamp(38px, 5vw, 66px);
      line-height: 1.15;
      margin: 18px 0;
    }

    .accent {
      color: var(--green);
    }

    .hero p {
      font-size: 18px;
      color: var(--muted);
      max-width: 620px;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      margin: 25px 0;
    }

    .checks {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      color: #45635d;
      font-size: 13px;
      font-weight: 700;
    }

    .preview {
      background: #fff;
      border: 1px solid #e5ebe7;
      border-radius: 25px;
      padding: 10px;
      box-shadow: 0 25px 70px #174f3920;
    }

    .preview img {
      display: block;
      width: 100%;
      border-radius: 18px;
    }

    .features {
      padding: 55px 0;
      background: #fff;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      border: 1px solid #e7eee9;
      border-radius: 18px;
      overflow: hidden;
    }

    .feature {
      padding: 25px 16px;
      text-align: center;
      background: #fff;
    }

    .icon {
      font-size: 30px;
    }

    .feature h3 {
      font-size: 16px;
      margin: 8px 0;
    }

    .feature p {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    section {
      padding: 75px 0;
    }

    .section-head {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-head h2 {
      font-size: 34px;
      margin: 0 0 8px;
    }

    .section-head p {
      color: var(--muted);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: #fff;
      border: 1px solid #e4ece7;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px #0b48300a;
    }

    .num {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #e7f5ee;
      color: var(--green);
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .ai {
      background: #edf8f2;
    }

    .ai-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      align-items: center;
    }

    .ai-box {
      background: #fff;
      border-radius: 22px;
      padding: 30px;
      border: 1px solid #dcebe3;
    }

    .ai-list {
      display: grid;
      gap: 12px;
    }

    .ai-list div {
      padding: 13px;
      border-radius: 12px;
      background: #f7faf8;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product {
      overflow: hidden;
    }

    .product .pic {
      height: 190px;
      background: linear-gradient(135deg, #1c4b43, #d2b071);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 45px;
    }

    .product h3 {
      margin: 15px 0 2px;
    }

    .price {
      font-weight: 900;
      color: var(--green);
    }

    .pricing {
      background: #fff;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .plan {
      padding: 28px;
      border: 1px solid #dce7e1;
      border-radius: 18px;
      background: #fff;
    }

    .plan.featured {
      border: 2px solid var(--green);
      transform: translateY(-8px);
    }

    .plan h3 {
      margin-top: 0;
    }

    .amount {
      font-size: 34px;
      font-weight: 900;
    }

    .plan ul {
      padding-right: 18px;
      color: var(--muted);
    }

    .register-section {
      background: #f7fbf8;
    }

    .register-card {
      max-width: 600px;
      margin: auto;
    }

    .register-form label {
      display: block;
      font-weight: 700;
      margin-top: 12px;
    }

    .register-form input {
      width: 100%;
      padding: 13px;
      margin: 6px 0 15px;
      border: 1px solid #dce7e1;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .register-form input:focus {
      border-color: var(--green);
    }

    .register-form .submit-btn {
      width: 100%;
      margin-top: 5px;
    }

    #registerMessage {
      text-align: center;
      margin-top: 15px;
      font-weight: 700;
    }

    .cta {
      background: linear-gradient(135deg, #063d37, #0b6e55);
      color: #fff;
      text-align: center;
    }

    .cta p {
      color: #d6ebe3;
    }

    .cta .secondary {
      color: var(--dark);
    }

    footer {
      background: #052f2b;
      color: #d8ebe4;
      padding: 28px 0;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 13px;
    }
